<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الحضور - مدرسة ألف التعليمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* إعدادات لتغطية الشاشة بالكامل وبشكل احترافي */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* يمنع ظهور شريط التمرير الخارجي */
            background-color: #fdfaf5; /* لون خلفية التطبيق لضمان تناسق التحميل */
        }

        /* تنسيق الإطار (Iframe) ليظهر كأنه تطبيق أصلي */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- تم وضع رابط التطبيق المحدث هنا -->
    <iframe 
        src="https://script.google.com/macros/s/AKfycbwVIdpAGkIPLmTaTXopZ5oOqFCzJlufIxvSIuGHRKD_4m-kXsAi8xfwyrPRyscBUD2N/exec"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        id="attendanceFrame">
    </iframe>

</body>
</html>
